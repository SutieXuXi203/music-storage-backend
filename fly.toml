# fly.toml app configuration file generated for music-storage-backend
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = "music-storage-backend"
primary_region = "sin"

[build]

[env]
  PORT = "8000"
  HOST = "0.0.0.0"
  DEBUG = "False"
  DATABASE_NAME = "music_app_db"
  JWT_ALGORITHM = "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES = "30"
  REFRESH_TOKEN_EXPIRE_DAYS = "30"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
